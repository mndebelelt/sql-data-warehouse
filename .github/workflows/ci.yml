name: SQL Warehouse CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SQL_HOST: localhost
      SQL_PORT: "1433"
      SQL_USER: sa
      SA_PASSWORD: ${{ secrets.SA_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start SQL Server (Docker)
        run: |
          docker run -d --name sqlserver \
            -e "ACCEPT_EULA=Y" \
            -e "MSSQL_SA_PASSWORD=${SA_PASSWORD}" \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Install sqlcmd (mssql-tools18)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl apt-transport-https gnupg
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
          echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

      - name: Wait for SQL Server to be ready
        run: |
          for i in {1..40}; do
            sqlcmd -S "$SQL_HOST,$SQL_PORT" -U "$SQL_USER" -P "$SA_PASSWORD" -C -Q "SELECT 1" && exit 0
            echo "Waiting for SQL Server..."
            sleep 5
          done
          echo "SQL Server did not become ready in time."
          docker logs sqlserver || true
          exit 1


      - name: Build warehouse (run all scripts)
        run: |
          cd scripts
          sqlcmd -S "$SQL_HOST,$SQL_PORT" -U "$SQL_USER" -P "$SA_PASSWORD" -C -b -i 00_run_all.sql

      - name: Run data quality tests
        run: |
          set -e
          for f in data-quality-checks/*.sql; do
            echo "Running $f"
            sqlcmd -S "$SQL_HOST,$SQL_PORT" -U "$SQL_USER" -P "$SA_PASSWORD" -C -b -i "$f"
          done

      - name: Stop container
        if: always()
        run: |
          docker rm -f sqlserver || true
